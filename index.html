<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PayPal</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        color: #111;
      }
      .card {
        background: #fff;
        padding: 2rem 2.5rem;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        text-align: center;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        background: #0070ba;
        color: #fff;
        text-decoration: none;
        padding: 0.9rem 1.5rem;
        border-radius: 10px;
        font-weight: 700;
      }
      a:hover {
        background: #005ea6;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>PayPal</h1>
      <a href="https://paypal.me/hairly.pro/" target="_blank" rel="noopener noreferrer">
        PayPal öffnen
      </a>
    </div>
  </body>
</html>
